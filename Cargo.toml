[workspace]
resolver = "3"
members = ["app", "core", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true

[workspace.dependencies]
kauf-core = { path = "core" }
crdts = { version = "7.3", default-features = false, features = ["num"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
