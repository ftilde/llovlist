[workspace]
resolver = "3"
members = ["app", "app-slint", "core", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Without this, DWARF left in the wasm makes wasm-opt abort and the bundle ships unoptimised.
[profile.release]
strip = true

[workspace.dependencies]
kauf-core = { path = "core" }
crdts = { version = "7.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
