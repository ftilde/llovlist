[package]
name = "kauf-app-slint"
version.workspace = true
edition.workspace = true
build = "build.rs"

# Android loads the app as a shared library; the bin is for running it on the desktop.
[lib]
name = "kauf_app_slint"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "1kauf-slint"
path = "src/main.rs"

[dependencies]
getrandom = "0.3"
kauf-core.workspace = true
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls-webpki-roots",
] }
serde.workspace = true
serde_json.workspace = true
# Android text input (composing text, backspace, caret/selection) is only fixed after
# the 1.17.1 release, so this stays on git until 1.17.2 ships.
slint = { git = "https://github.com/slint-ui/slint", rev = "b8c95d4e7059587a574a921dc67fb86c1f3fc9b6" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
slint = { git = "https://github.com/slint-ui/slint", rev = "b8c95d4e7059587a574a921dc67fb86c1f3fc9b6", features = [
    "backend-android-activity-06",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "6"
env_logger = "0.11"

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "b8c95d4e7059587a574a921dc67fb86c1f3fc9b6" }

# A separate package id from the Dioxus build, so both can sit on the phone side by side.
[package.metadata.android]
package = "com.ftilde.kauf.slint"
apk_name = "1kauf-slint"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

# cargo-apk feeds this to both the manifest and the NDK, so they cannot drift apart.
[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "1kauf slint"

# The stock debug keystore: enough to sideload a prototype, not enough to ship one.
# Release builds need it because Slint is unusably slow unoptimised.
[package.metadata.android.signing.release]
path = "/home/dominik/.android/debug.keystore"
keystore_password = "android"
